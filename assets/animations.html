<!-- CSS ANIMATION ALTERNATIVES (No external dependencies) -->
<style>
/* Floating orbs animation - Add to hero section */
@keyframes float-orb {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -30px) scale(1.1); }
  50% { transform: translate(-20px, 20px) scale(0.9); }
  75% { transform: translate(20px, 30px) scale(1.05); }
}

.animated-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.4;
  animation: float-orb 15s ease-in-out infinite;
}

.orb-1 {
  width: 400px;
  height: 400px;
  background: #0066FF;
  top: 10%;
  right: 10%;
  animation-delay: 0s;
}

.orb-2 {
  width: 300px;
  height: 300px;
  background: #FF8C42;
  bottom: 20%;
  left: 5%;
  animation-delay: -5s;
}

.orb-3 {
  width: 250px;
  height: 250px;
  background: #00A86B;
  top: 50%;
  left: 30%;
  animation-delay: -10s;
}

/* Glowing pulse effect for CTA buttons */
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(0, 102, 255, 0.4); }
  50% { box-shadow: 0 0 40px rgba(0, 102, 255, 0.8), 0 0 60px rgba(0, 102, 255, 0.4); }
}

.btn-glow {
  animation: glow-pulse 2s ease-in-out infinite;
}

/* Data stream animation for background */
@keyframes data-stream {
  0% { transform: translateY(-100%); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0; }
}

.data-particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #0066FF;
  border-radius: 50%;
  animation: data-stream 8s linear infinite;
}
</style>
